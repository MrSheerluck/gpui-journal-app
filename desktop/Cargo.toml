[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
gpui = {version = "=0.3.9", package = "gpui-pre"}
gpui_platform = {version = "=0.3.9", package = "gpui-pre-platform", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
]}
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
unicode-segmentation = "=1.13.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }



