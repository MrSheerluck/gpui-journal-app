[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
gpui = {version = "=0.3.9", package = "gpui-pre"}
gpui_platform = {version = "=0.3.9", package = "gpui-pre-platform", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
]}


