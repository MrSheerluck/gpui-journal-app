[package]
name = "dainiki-desktop"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Dainiki desktop app: journal shell around the Markdown editor."

[dependencies]
gpui-kit = "=0.7.3"
dainiki-editor = { path = "../editor" }
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"

[dev-dependencies]
