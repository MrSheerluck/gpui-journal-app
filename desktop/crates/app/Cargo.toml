[package]
name = "dainiki-desktop"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Dainiki desktop app: journal shell around the Markdown editor."

[dependencies]
gpui-kit = "=0.7.3"
dainiki-editor = { path = "../editor" }
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
async-channel = "=2.5.0"
notify = "=8.2.0"
trash = "=5.2.9"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = "0.3"
objc2-avf-audio = { version = "0.3", features = ["AVAudioPlayer"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
